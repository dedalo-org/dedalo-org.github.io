name: Pages

on:
  push:
    branches: [main]
  # The site is checked before it is merged, not after. `main` requires this
  # job to pass, and a required check that only runs on push would never
  # report on a pull request — which blocks every merge forever.
  pull_request:
  workflow_dispatch:
  # The status section is rendered from dedalo's changelog, which changes in
  # another repository and cannot push here. A rebuild every morning is what
  # makes "generated from the changelog" true rather than "generated once".
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 10
    name: check and assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the site
        run: |
          set -euo pipefail
          # Structure, CSS balance, metadata and every internal link, resolved
          # against the tree about to be published. `/dedalo/` is a different
          # deployment on the same domain, so it is declared rather than
          # resolved here.
          scripts/check-site.py --root site --built site --base-path "" --external-prefix /dedalo/

          # Every colour against the background it sits on. A palette is easy
          # to admire and hard to read, and "the dim grey is fine" should be a
          # number rather than an opinion.
          scripts/check-contrast.py --quiet

          # The favicon is generated. This fails if the page carries a hand-
          # edited icon, or one produced by an older version of the generator —
          # which is the only way an asset built from code stays built from it.
          scripts/make-sprites.py --check

          # The OpenGraph card, same rule: generated from code, checked here,
          # and rasterised at assembly time. A stale og.svg means the card a
          # crawler fetches is not the one this script describes.
          scripts/make-og-image.py --check

      # Fetched at build time rather than by the page: the CSP says
      # `default-src 'none'` and that is worth more than freshness measured in
      # seconds. A failure here stops the deploy, which leaves the previous
      # page up — and it was true when it was made.
      - name: Render the changelog into the status section
        run: scripts/sync-changelog.py --write

      # Re-run after the injection, because the thing that was checked above
      # is no longer the thing about to be published.
      - name: Re-check the assembled page
        run: |
          set -euo pipefail
          scripts/check-site.py --root site --built site --base-path "" --external-prefix /dedalo/
          scripts/check-contrast.py --quiet

      # Most crawlers do not render SVG for OpenGraph, so the card has to be a
      # PNG. It is produced here rather than committed: a PNG in the repository
      # is a binary blob nobody can review, and regenerating it means finding
      # whatever produced it. What lives in git is site/og.svg, which is text.
      #
      # librsvg rather than a Rust rasteriser because it is one apt line and no
      # compile, and the card needs no font: every glyph is a `<path>` produced
      # by make-og-image.py, so the output does not depend on what is installed.
      - name: Install the rasteriser
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Assemble
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          # Pages must not run Jekyll over the tree.
          touch _site/.nojekyll

          rsvg-convert -w 1200 -h 630 site/og.svg -o _site/og.png
          # The SVG source is not published: what the meta tags name is the
          # PNG, and shipping both invites somebody to link the wrong one.
          rm -f _site/og.svg

          test -f _site/index.html
          test -f _site/404.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -s _site/og.png
          # 1200x630, or a crawler crops it. Read from the file rather than
          # trusted, because the whole point of generating it is that nobody
          # checks it by eye.
          file _site/og.png | grep -q '1200 x 630' || {
            echo "::error title=Wrong card size::og.png is not 1200x630"
            file _site/og.png
            exit 1
          }

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    timeout-minutes: 10
    name: deploy to github pages
    # Only from `main`. A pull request builds and checks the site; publishing
    # it is what merging is for.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
